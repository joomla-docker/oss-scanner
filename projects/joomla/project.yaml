# Joomla's default branch is the patch branch of the current stable minor (6.2-dev when this was written) and moves
# to the next minor's patch branch when that minor is released, so following it needs no change here. Add #<branch>
# to hold one.
repo: https://github.com/joomla/joomla-cms
homepage: https://www.joomla.org/

# The Joomla! Security Strike Team (JSST) receives reports for Joomla core through its team mailbox, encrypted to the
# team key below. GitHub security advisories stay off: the JSST coordinates by email.
primary_contact: security@joomla.org
disabled: false
output_format:
  email:
    min_severity: low
  github_security_advisory:
    min_severity: none

